name: Workflow Commands
on: [push]

jobs:
  my-job:
    runs-on: ubuntu-latest
    steps:
        - name: Group Logging
          run: |
            echo "::group::Starting group"
            echo "Msg 1"
            echo "Msg 2"
            echo "::endgroup::"
        - name: Step 1
          run: |
            echo "MY_VAL=Hello" >> $GITHUB_ENV
        - name: Step 2
          run: |
            echo "The value of MY_VAL is $MY_VAL"